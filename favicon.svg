<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <defs>
        <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1d"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="gradCyber" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#818cf8"/>
        </linearGradient>
    </defs>
    
    <!-- Background Card -->
    <rect width="120" height="120" rx="32" fill="url(#gradBg)"/>
    
    <!-- Cyber Border Ring -->
    <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="url(#gradCyber)" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Futuristic Monogram "S" -->
    <path d="M 75 42 C 64 35, 46 38, 46 51 C 46 67, 76 63, 76 78 C 76 91, 56 94, 45 84" 
          fill="none" 
          stroke="url(#gradCyber)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
</svg>