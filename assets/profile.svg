<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#191b24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d078" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a37b4c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent -->
  <g stroke="#262933" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Central Glow -->
  <circle cx="200" cy="220" r="160" fill="url(#glow)" />

  <!-- Outer Orbit Ring -->
  <circle cx="200" cy="220" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="200" cy="220" r="95" fill="#12131a" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Stylized "S" Monogram in Center -->
  <path d="M 225 170 C 200 155, 175 165, 175 190 C 175 225, 228 215, 228 250 C 228 280, 195 285, 172 270" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Decorative Orbit Nodes -->
  <circle cx="200" cy="110" r="5" fill="#f3d078" />
  <circle cx="200" cy="330" r="5" fill="#a37b4c" />
  <circle cx="90" cy="220" r="5" fill="#d4af37" />
  <circle cx="310" cy="220" r="5" fill="#d4af37" />

  <!-- Label badge -->
  <rect x="90" y="380" width="220" height="38" rx="19" fill="#12131a" stroke="#262933" stroke-width="1.5" />
  <text x="200" y="404" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    SHEENA U
  </text>
  <text x="200" y="440" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#8e9bb0" text-anchor="middle" letter-spacing="1">
    AI &amp; CLOUD SYSTEMS
  </text>
</svg>
